<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Django App{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h2> ➕ Add you note Here </h2>
    <form method="post">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">Add</button>
    </form>
    <br>
    <h3> All Notes</h3>
    <a href="{% url "notes_list" %}"> All Notes</a> 
    <footer>
        <p>&copy; 2026 My Notes App</p>
    </footer>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
